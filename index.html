    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .dark .glass { background: rgba(31, 41, 55, 0.9); backdrop-filter: blur(10px); }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        
        /* Extra utility animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInDown { from { opacity: 0; transform: translate3d(0, -20px, 0); } to { opacity: 1; transform: translate3d(0, 0, 0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .animate-fade-in-down { animation: fadeInDown 0.4s ease-out forwards; }

        /* QR Scanner Tailwind UI Fixes */
        #reader { width: 100%; border: none !important; border-radius: 12px; overflow: hidden; background: transparent; }
        #reader video { object-fit: cover; border-radius: 12px; width: 100%; }
        
        #reader button {
            background-color: #10b981 !important;
            color: white !important;
            padding: 8px 16px !important;
            border-radius: 8px !important;
            font-weight: 600 !important;
            margin: 8px !important;
            border: none !important;
            cursor: pointer !important;
            transition: background-color 0.2s !important;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1) !important;
        }
        #reader button:hover { background-color: #059669 !important; }
        
        #reader select {
            padding: 10px !important;
            border-radius: 8px !important;
            border: 2px solid #cbd5e1 !important;
            margin: 8px !important;
            background-color: white !important;
            color: #1e293b !important;
            font-weight: 500 !important;
            max-width: 90%;
        }
        
        #reader a { color: #3b82f6 !important; text-decoration: underline !important; font-weight: 500 !important; margin-top: 10px !important; display: inline-block !important; }

        .lang-select-box {
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 0.75rem;
            padding: 0.5rem 0.75rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .dark .lang-select-box {
            background-color: #1e293b;
            border-color: #475569;
        }
        .lang-select-box select {
            background: transparent;
            border: none;
            outline: none;
            font-weight: 600;
            font-size: 0.8rem;
            color: #0f172a;
            cursor: pointer;
            padding-right: 0.25rem;
        }
        .dark .lang-select-box select { color: #f1f5f9; }
        .lang-select-box select option { color: #0f172a; background-color: #ffffff; }
    </style>

        // ---------------------------------------------------------------
        // Google Translate rewrites text nodes directly in the DOM. When
        // React later tries to reconcile/remove those same nodes it can
        // throw "Failed to execute 'removeChild'/'insertBefore' on 'Node'"
        // which crashes the whole app to a blank screen. This patch makes
        // those two calls no-ops instead of throwing when the node is no
        // longer where React expects it, so translation can never take
        // the app down.
        (function protectDomFromTranslate() {
            if (typeof Node !== 'function' || !Node.prototype) return;
            const originalRemoveChild = Node.prototype.removeChild;
            Node.prototype.removeChild = function (child) {
                if (child.parentNode !== this) {
                    if (window.console) console.warn('[translate-guard] skipped removeChild on detached node');
                    return child;
                }
                return originalRemoveChild.apply(this, arguments);
            };
            const originalInsertBefore = Node.prototype.insertBefore;
            Node.prototype.insertBefore = function (newNode, referenceNode) {
                if (referenceNode && referenceNode.parentNode !== this) {
                    if (window.console) console.warn('[translate-guard] skipped insertBefore on detached node');
                    return newNode;
                }
                return originalInsertBefore.apply(this, arguments);
            };
        })();

        // Buckets patients into age groups and renders a 3D-style column
        // chart (matching the look of a native Excel 3D column chart) onto
        // an offscreen canvas, returning it as PNG bytes. Kept dependency
        // free (no chart library) so it works purely off the Canvas API.
        function buildAgeDistributionChartPng(patients) {
            const groups = [
                { label: '0-18', min: 0, max: 18 },
                { label: '19-35', min: 19, max: 35 },
                { label: '36-55', min: 36, max: 55 },
                { label: '56+', min: 56, max: Infinity }
            ];
            const counts = groups.map(g => ({
                label: g.label,
                count: patients.filter(p => {
                    const age = Number(p.age);
                    return !isNaN(age) && age >= g.min && age <= g.max;
                }).length
            }));

            const width = 640, height = 420;
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            // Background
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);

            // Title
            ctx.fillStyle = '#404040';
            ctx.font = 'bold 18px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Patient Age Distribution', width / 2, 34);

            const plotLeft = 70, plotRight = width - 40, plotTop = 65, plotBottom = height - 70;
            const plotHeight = plotBottom - plotTop;
            const maxCount = Math.max(1, ...counts.map(c => c.count));
            // Round the axis max up to a "nice" step (5/10/20/50...) like Excel does.
            const niceMax = (() => {
                const rough = maxCount <= 5 ? 5 : Math.ceil(maxCount / 5) * 5;
                return rough;
            })();
            const gridSteps = 5;

            // Gridlines + Y axis labels
            ctx.strokeStyle = '#d9d9d9';
            ctx.fillStyle = '#595959';
            ctx.font = '12px Arial';
            ctx.textAlign = 'right';
            ctx.lineWidth = 1;
            for (let i = 0; i <= gridSteps; i++) {
                const value = Math.round((niceMax / gridSteps) * i);
                const y = plotBottom - (plotHeight * i) / gridSteps;
                ctx.beginPath();
                ctx.moveTo(plotLeft, y);
                ctx.lineTo(plotRight, y);
                ctx.stroke();
                ctx.fillText(String(value), plotLeft - 10, y + 4);
            }

            // Bars (with a simple pseudo-3D top + side face)
            const depth = 12; // 3D extrusion depth in px
            const groupWidth = (plotRight - plotLeft) / counts.length;
            const barWidth = groupWidth * 0.5;

            counts.forEach((c, i) => {
                const barHeight = (c.count / niceMax) * plotHeight;
                const x = plotLeft + i * groupWidth + (groupWidth - barWidth) / 2;
                const yTop = plotBottom - barHeight;

                // Front face
                const gradient = ctx.createLinearGradient(x, yTop, x, plotBottom);
                gradient.addColorStop(0, '#7fadde');
                gradient.addColorStop(1, '#4a7fc1');
                ctx.fillStyle = gradient;
                ctx.fillRect(x, yTop, barWidth, barHeight);

                // Top face (parallelogram, gives the 3D look)
                ctx.fillStyle = '#a9c8e8';
                ctx.beginPath();
                ctx.moveTo(x, yTop);
                ctx.lineTo(x + depth, yTop - depth);
                ctx.lineTo(x + barWidth + depth, yTop - depth);
                ctx.lineTo(x + barWidth, yTop);
                ctx.closePath();
                ctx.fill();

                // Side face
                ctx.fillStyle = '#3a6494';
                ctx.beginPath();
                ctx.moveTo(x + barWidth, yTop);
                ctx.lineTo(x + barWidth + depth, yTop - depth);
                ctx.lineTo(x + barWidth + depth, plotBottom - depth);
                ctx.lineTo(x + barWidth, plotBottom);
                ctx.closePath();
                ctx.fill();

                // Value label above bar
                ctx.fillStyle = '#404040';
                ctx.font = 'bold 13px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(String(c.count), x + barWidth / 2, yTop - depth - 8);

                // Category label on X axis
                ctx.font = '12px Arial';
                ctx.fillText(c.label, x + barWidth / 2, plotBottom + 20);
            });

            // Axis lines
            ctx.strokeStyle = '#a6a6a6';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(plotLeft, plotTop - 10);
            ctx.lineTo(plotLeft, plotBottom);
            ctx.lineTo(plotRight, plotBottom);
            ctx.stroke();

            const dataUrl = canvas.toDataURL('image/png');
            const base64 = dataUrl.split(',')[1];
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return { bytes, counts };
        }

        // ---------------------------------------------------------------
        // Self-hosted translation engine.
        //
        // The old approach embedded Google's website-translator widget,
        // which relies on a cross-origin iframe + cookies. Modern Chrome's
        // third-party-cookie restrictions (and some networks) can stop
        // that widget from ever finishing initialization, permanently
        // stuck on "loading" with no way to recover — exactly the bug
        // reported.
        //
        // Instead, this calls Google's lightweight translate endpoint
        // directly (plain GET, no cookies, no iframe) for the actual
        // English text found on the page, caches every result, and writes
        // translated strings straight into the existing DOM text nodes.
        // Because we only ever change nodeValue (never add/remove nodes),
        // this can't cause the removeChild/insertBefore crashes that used
        // to plague widget-based translation either.
        // ---------------------------------------------------------------

        const translationCache = { en: {} };
        const originalTextByNode = new WeakMap();
        let translationGeneration = 0;
        let isApplyingTranslation = false;

        (function loadTranslationCache() {
            try {
                const raw = localStorage.getItem('carenet_translation_cache');
                if (raw) Object.assign(translationCache, JSON.parse(raw));
            } catch (e) { /* corrupt/unavailable cache — start fresh */ }
        })();

        function persistTranslationCache() {
            try { localStorage.setItem('carenet_translation_cache', JSON.stringify(translationCache)); }
            catch (e) { /* storage full/unavailable — cache just stays in-memory */ }
        }

        async function translateOneString(text, targetLang, attempt = 0) {
            if (translationCache[targetLang] && translationCache[targetLang][text] !== undefined) {
                return translationCache[targetLang][text];
            }
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
            const res = await fetch(url);
            if (res.status === 429 && attempt < 3) {
                await new Promise(r => setTimeout(r, 500 * (attempt + 1)));
                return translateOneString(text, targetLang, attempt + 1);
            }
            if (!res.ok) throw new Error('translate request failed: ' + res.status);
            const data = await res.json();
            const translated = (data[0] || []).map(segment => segment[0]).join('');
            if (!translationCache[targetLang]) translationCache[targetLang] = {};
            translationCache[targetLang][text] = translated;
            return translated;
        }

        // Runs `worker` over `items` with at most `limit` in flight at once,
        // so we don't fire hundreds of simultaneous requests at once.
        async function runWithConcurrency(items, limit, worker) {
            let cursor = 0;
            const lanes = new Array(Math.min(limit, items.length) || 0).fill(0).map(async () => {
                while (cursor < items.length) {
                    const item = items[cursor++];
                    await worker(item);
                }
            });
            await Promise.all(lanes);
        }

        function isTranslatableTextNode(node) {
            if (!node || node.nodeType !== Node.TEXT_NODE || !node.nodeValue || !node.nodeValue.trim()) return false;
            let el = node.parentElement;
            while (el) {
                const tag = el.tagName;
                if (tag === 'SCRIPT' || tag === 'STYLE') return false;
                if (el.classList && el.classList.contains('notranslate')) return false;
                if (el.getAttribute && el.getAttribute('translate') === 'no') return false;
                el = el.parentElement;
            }
            return true;
        }

        function collectTranslatableTextNodes(root) {
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
                acceptNode: node => isTranslatableTextNode(node) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP
            });
            const nodes = [];
            let current;
            while ((current = walker.nextNode())) nodes.push(current);
            return nodes;
        }

        // Translates (or restores to English) every visible text node
        // currently in the DOM. Safe to call repeatedly — anything already
        // translated/cached is applied instantly and only genuinely new
        // text triggers a network call.
        async function applyTranslationToPage(targetLang, onProgress) {
            const root = document.getElementById('root');
            if (!root) return;
            const myGeneration = ++translationGeneration;
            const nodes = collectTranslatableTextNodes(root);

            const pending = [];
            isApplyingTranslation = true;
            nodes.forEach(node => {
                if (!originalTextByNode.has(node)) originalTextByNode.set(node, node.nodeValue);
                const original = originalTextByNode.get(node);
                if (targetLang === 'en') {
                    if (node.nodeValue !== original) node.nodeValue = original;
                } else if (translationCache[targetLang] && translationCache[targetLang][original] !== undefined) {
                    node.nodeValue = translationCache[targetLang][original];
                } else {
                    pending.push(node);
                }
            });
            isApplyingTranslation = false;

            if (targetLang === 'en' || pending.length === 0) {
                if (onProgress) onProgress(1);
                return;
            }

            let completed = 0;
            await runWithConcurrency(pending, 6, async node => {
                const original = originalTextByNode.get(node);
                try {
                    const translated = await translateOneString(original, targetLang);
                    if (translationGeneration === myGeneration) {
                        isApplyingTranslation = true;
                        node.nodeValue = translated;
                        isApplyingTranslation = false;
                    }
                } catch (e) {
                    // Leave the original English in place rather than
                    // breaking the row — a partial translation is far
                    // better than a crashed page.
                } finally {
                    completed += 1;
                    if (onProgress) onProgress(completed / pending.length);
                }
            });
            persistTranslationCache();
        }

        function GoogleTranslate() {
            const [selectedLang, setSelectedLang] = React.useState(() => localStorage.getItem('carenet_lang') || 'en');
            const [status, setStatus] = React.useState('idle'); // idle | translating | ready | error
            const selectedLangRef = React.useRef(selectedLang);

            React.useEffect(() => { selectedLangRef.current = selectedLang; }, [selectedLang]);

            const applyLanguage = React.useCallback(async (langCode) => {
                setSelectedLang(langCode);
                localStorage.setItem('carenet_lang', langCode);
                setStatus(langCode === 'en' ? 'idle' : 'translating');
                try {
                    await applyTranslationToPage(langCode, progress => {
                        if (progress >= 1) setStatus(langCode === 'en' ? 'idle' : 'ready');
                    });
                } catch (e) {
                    setStatus('error');
                }
            }, []);

            // Re-apply the saved language on first load (covers refresh),
            // and keep translating newly-rendered content (new patient
            // rows, tab switches, etc.) as the app updates.
            React.useEffect(() => {
                if (selectedLangRef.current !== 'en') applyLanguage(selectedLangRef.current);

                const root = document.getElementById('root');
                if (!root) return;
                let debounceTimer = null;
                const observer = new MutationObserver(() => {
                    if (isApplyingTranslation || selectedLangRef.current === 'en') return;
                    clearTimeout(debounceTimer);
                    debounceTimer = setTimeout(() => {
                        applyTranslationToPage(selectedLangRef.current).catch(() => {});
                    }, 400);
                });
                observer.observe(root, { childList: true, subtree: true, characterData: true });
                return () => { observer.disconnect(); clearTimeout(debounceTimer); };
            }, [applyLanguage]);

            return (
                <div className="flex items-center justify-center mt-2 md:mt-0">
                    <div className="lang-select-box notranslate shadow-sm" title={status === 'error' ? 'Some text could not be translated — check your internet connection' : ''}>
                        <i className={`fa-solid ${
                            status === 'error' ? 'fa-triangle-exclamation text-amber-500' :
                            status === 'translating' ? 'fa-spinner fa-spin text-emerald-600 dark:text-emerald-400' :
                            'fa-globe text-emerald-600 dark:text-emerald-400'
                        }`}></i>
                        <span className="hidden sm:inline text-xs font-bold text-slate-500 dark:text-slate-400">Language:</span>
                        <select
                            value={selectedLang}
                            onChange={(e) => applyLanguage(e.target.value)}
                            aria-label="Select language"
                        >

                                <option key={l.code} value={l.code}>{l.label}</option>
                            ))}
                        </select>
                    </div>
                </div>
            );
        }

        function DonutChart({ segments, size = 170, strokeWidth = 26 }) {
            const total = segments.reduce((sum, s) => sum + s.count, 0);
            const radius = (size - strokeWidth) / 2;
            const circumference = 2 * Math.PI * radius;
            let offsetAccum = 0;

            return (
                <div className="relative flex-shrink-0" style={{ width: size, height: size }}>
                    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="-rotate-90">
                        <circle
                            cx={size / 2}
                            cy={size / 2}
                            r={radius}
                            fill="none"
                            stroke="currentColor"
                            className="text-slate-100 dark:text-slate-700"
                            strokeWidth={strokeWidth}
                        />
                        {total > 0 && segments.filter(s => s.count > 0).map((s, i) => {
                            const dash = (s.count / total) * circumference;
                            const dashArray = `${dash} ${circumference - dash}`;
                            const dashOffset = -offsetAccum;
                            offsetAccum += dash;
                            return (
                                <circle
                                    key={i}
                                    cx={size / 2}
                                    cy={size / 2}
                                    r={radius}
                                    fill="none"
                                    stroke={s.hex}
                                    strokeWidth={strokeWidth}
                                    strokeDasharray={dashArray}
                                    strokeDashoffset={dashOffset}
                                />
                            );
                        })}
                    </svg>
                    <div className="absolute inset-0 flex flex-col items-center justify-center">
                        <span className="text-2xl font-extrabold text-slate-700 dark:text-slate-200">{total}</span>
                        <span className="text-[10px] font-bold uppercase tracking-wide text-slate-400">Patients</span>
                    </div>
                </div>
            );
        }

                            showMsg("Database sync issue with scanned patient.", "error");
                        }
                    }
                    
                    setScannedPatient(patient);
                    showMsg("Patient QR scan read successfully.", 'success');
                } else {
                    showMsg("Invalid code formatting. Expecting CareNet Patient Identity card.", 'error');
                }
            };

            const assignDoctor = async (doctorId) => {
                if(!scannedPatient || !isDbReady) return;
                
                try {
                    if (db) {
                        const { doc, updateDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                        const docRef = doc(db, 'artifacts', 'medcamp-6a0f8', 'public', 'data', 'patients', scannedPatient.id);
                        await updateDoc(docRef, { 
                            status: 'In Queue', 
                            assignedDoctor: doctorId 
                        });
                    } else {
                        setPatients(prev => prev.map(p => 
                            p.id === scannedPatient.id ? { ...p, status: 'In Queue', assignedDoctor: doctorId } : p
                        ));
                    }
                    
                    setScannedPatient(null);
                    showMsg("Patient assigned to doctor desk queue.", 'success');
                } catch (error) {
                    showMsg("Error syncing doctor assignment.", 'error');
                    console.error(error);
                }
            };

            const handleEndSession = async (patientId, prescriptionText) => {
                if (!prescriptionText.trim()) {
                    showMsg("Please enter prescription instructions before finalizing.", 'error');
                    return;
                }

                try {
                    if (db) {
                        const { doc, updateDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                        const docRef = doc(db, 'artifacts', 'medcamp-6a0f8', 'public', 'data', 'patients', patientId);
                        await updateDoc(docRef, { 
                            status: 'Prescribed', 
                            prescription: prescriptionText 
                        });
                    } else {
                        setPatients(prev => prev.map(p => 
                            p.id === patientId ? { ...p, status: 'Prescribed', prescription: prescriptionText } : p
                        ));
                    }
                    
                    showMsg("Session Completed! Prescription generated & dispatched directly to Patient card.", 'success');
                } catch (error) {
                    showMsg("Error processing session completion.", 'error');
                    console.error(error);
                }
            };

            const handlePharmacyScan = async (qrData) => {
                setScanningFor(null);
                if (qrData.startsWith("RX|")) {
                    const parts = qrData.split("|");
                    const id = parts[1];
                    let patient = patients.find(p => p.id === id);
                    
                    if (!patient) {
                        try {
                            patient = {
                                id: parts[1],
                                name: parts[2],
                                prescription: parts.slice(3).join("|"), 
                                status: 'Prescribed',
                                timestamp: Date.now()
                            };
                            
                            if (db) {
                                const { doc, setDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                                const docRef = doc(db, 'artifacts', 'medcamp-6a0f8', 'public', 'data', 'patients', patient.id);
                                await setDoc(docRef, patient);
                            } else {
                                setPatients(prev => [...prev, patient]);
                            }
                            setBillingPatient(patient);
                            showMsg("Prescription scanned successfully.", 'success');
                        } catch (e) {
                            console.error(e);
                        }
                    } else if (patient && patient.status === 'Prescribed') {
                        setBillingPatient(patient);
                        showMsg("Prescription scanned successfully.", 'success');
                    } else {
                        showMsg("Patient state is already billed, closed, or invalid.", 'error');
                    }
                } else {
                    showMsg("Invalid Rx format detected.", 'error');
                }
            };

            // Pharmacy is free of cost at the camp — no billing/payment is collected.
            // Once medication is handed over, the visit is simply marked Completed
            // and the prescription remains visible on the patient's own portal.
            const completeDispense = async () => {
                if (!billingPatient) return;
                try {
                    if (db) {
                        const { doc, updateDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                        const docRef = doc(db, 'artifacts', 'medcamp-6a0f8', 'public', 'data', 'patients', billingPatient.id);
                        await updateDoc(docRef, { 
                            status: 'Completed'
                        });
                    } else {
                        setPatients(prev => prev.map(p => 
                            p.id === billingPatient.id ? { ...p, status: 'Completed' } : p
                        ));
                    }
                    
                    setBillingPatient(null);
                    showMsg(`Medication dispensed to ${billingPatient.name}. Visit completed — free of cost.`, 'success');
                } catch (error) {
                    showMsg("Error updating dispense status.", "error");
                    console.error(error);
                }
            };

            // ---- Admin analytics helpers (derived purely from live patients/users data) ----
            const volunteerCount = users.filter(u => u.role === 'Volunteer').length;
            const doctorCount = users.filter(u => u.role === 'Doctor').length;
            const pharmacyCount = users.filter(u => u.role === 'Pharmacy').length;
            const totalPatients = patients.length;
            const attendedCount = patients.filter(p => p.status === 'Completed').length;
            const inQueueCount = patients.filter(p => p.status === 'In Queue').length;
            const awaitingCount = patients.filter(p => p.status === 'Awaiting Volunteer').length;
            const prescribedCount = patients.filter(p => p.status === 'Prescribed').length;
            const genderColorMap = { Male: { color: 'bg-blue-500', hex: '#3b82f6' }, Female: { color: 'bg-pink-500', hex: '#ec4899' }, Other: { color: 'bg-purple-500', hex: '#a855f7' } };
            const genderBreakdown = ['Male', 'Female', 'Other'].map(g => ({
                label: g,
                count: patients.filter(p => (p.gender || '').toLowerCase() === g.toLowerCase()).length,
                color: genderColorMap[g].color,
                hex: genderColorMap[g].hex
            }));
            const doctorBreakdown = users.filter(u => u.role === 'Doctor').map(doc => ({
                label: doc.name,
                count: patients.filter(p => p.assignedDoctor === doc.id).length
            }));
            const statusBreakdown = [
                { label: 'Awaiting Triage', count: awaitingCount, color: 'bg-slate-400', hex: '#94a3b8' },
                { label: 'In Queue', count: inQueueCount, color: 'bg-indigo-500', hex: '#6366f1' },
                { label: 'Prescribed', count: prescribedCount, color: 'bg-rose-500', hex: '#f43f5e' },
                { label: 'Completed', count: attendedCount, color: 'bg-emerald-500', hex: '#10b981' }
            ];
            // Bars are filled as a true percentage of the whole (not relative to
            // whichever category happens to be largest), so a count of 2 out of 4
            // patients shows as a half-filled bar instead of a full one.
            const statusTotalBase = Math.max(1, totalPatients);
            const genderTotalBase = Math.max(1, totalPatients);
            const doctorTotalBase = Math.max(1, totalPatients);

            const generateCsvReport = async () => {
                if (typeof XLSX === 'undefined') {
                    showMsg("Report library still loading, please try again in a moment.", "error");
                    return;
                }

                const headers = ['Patient ID', 'Name', 'Age', 'Gender', 'Symptoms', 'Status', 'Assigned Doctor', 'Prescription', 'Registered At'];
                const rows = patients.map(p => {
                    const doctorName = users.find(u => u.id === p.assignedDoctor)?.name || '';
                    const registeredAt = p.timestamp ? new Date(p.timestamp).toLocaleString() : '';
                    return [p.id, p.name, p.age ? Number(p.age) : '', p.gender, p.symptoms, p.status, doctorName, p.prescription || '', registeredAt];
                });

                // Age summary table + chart get appended a couple of rows below
                // the patient data, same layout as a manually-built camp report.
                const { bytes: chartPngBytes, counts: ageCounts } = buildAgeDistributionChartPng(patients);
                const summaryStartRow = rows.length + 3; // 0-indexed row the "Age Group" header lands on
                const sheetData = [
                    headers,
                    ...rows,
                    [],
                    ['Age Group', 'Patient Count'],
                    ...ageCounts.map(c => [c.label, c.count])
                ];

                // Build the worksheet directly from the array-of-arrays so every row
                // lines up under the correct header column.
                const worksheet = XLSX.utils.aoa_to_sheet(sheetData);

                // Auto-fit each column to its widest value (header or data) so nothing
                // gets clipped or left with huge empty gaps like a raw CSV does.
                worksheet['!cols'] = headers.map((header, colIndex) => {
                    const longest = sheetData.reduce((max, row) => {
                        const cellText = row[colIndex] != null ? String(row[colIndex]) : '';
                        return Math.max(max, cellText.length);
                    }, header.length);
                    return { wch: Math.min(Math.max(longest + 2, 10), 40) };
                });

                // Freeze the header row so column titles stay visible while scrolling.
                worksheet['!freeze'] = { xSplit: 0, ySplit: 1 };
                worksheet['!autofilter'] = { ref: `A1:${XLSX.utils.encode_col(headers.length - 1)}${rows.length + 1}` };

                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, 'Patients');
                const baseArrayBuffer = XLSX.write(workbook, { type: 'array', bookType: 'xlsx' });
                const fileName = `CareNet_Camp_Report_${new Date().toISOString().slice(0, 10)}.xlsx`;

                // SheetJS's free build can create the spreadsheet but can't write
                // native chart objects, so the chart is rendered to PNG above and
                // spliced into the .xlsx package here as a real embedded picture
                // (this is standard OOXML — Excel/Google Sheets/LibreOffice all
                // open it as a normal image, positioned right under the summary
                // table, same as the reference report).
                if (typeof JSZip === 'undefined') {
                    XLSX.writeFile(workbook, fileName);
                    showMsg("Report downloaded (chart image skipped — chart library unavailable).", "info");
                    return;
                }

                try {
                    const zip = await JSZip.loadAsync(baseArrayBuffer);

                    zip.file('xl/media/image1.png', chartPngBytes);

                    const EMU_PER_PX = 9525;
                    const chartPxWidth = 640, chartPxHeight = 420;
                    const widthEmu = chartPxWidth * EMU_PER_PX;
                    const heightEmu = chartPxHeight * EMU_PER_PX;
                    const anchorRow = summaryStartRow + ageCounts.length + 2; // a couple rows below the summary table

                    const drawingXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
  <xdr:oneCellAnchor>
    <xdr:from><xdr:col>0</xdr:col><xdr:colOff>0</xdr:colOff><xdr:row>${anchorRow}</xdr:row><xdr:rowOff>0</xdr:rowOff></xdr:from>
    <xdr:ext cx="${widthEmu}" cy="${heightEmu}"/>
    <xdr:pic>
      <xdr:nvPicPr>
        <xdr:cNvPr id="2" name="AgeDistributionChart"/>
        <xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr>
      </xdr:nvPicPr>
      <xdr:blipFill>
        <a:blip r:embed="rId1"/>
        <a:stretch><a:fillRect/></a:stretch>
      </xdr:blipFill>
      <xdr:spPr>
        <a:xfrm><a:off x="0" y="0"/><a:ext cx="${widthEmu}" cy="${heightEmu}"/></a:xfrm>
        <a:prstGeom prst="rect"><a:avLst/></a:prstGeom>
      </xdr:spPr>
    </xdr:pic>
    <xdr:clientData/>
  </xdr:oneCellAnchor>
</xdr:wsDr>`;
                    zip.file('xl/drawings/drawing1.xml', drawingXml);

                    zip.file('xl/drawings/_rels/drawing1.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/image1.png"/>
</Relationships>`);

                    zip.file('xl/worksheets/_rels/sheet1.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" Target="../drawings/drawing1.xml"/>
</Relationships>`);

                    let sheetXml = await zip.file('xl/worksheets/sheet1.xml').async('string');
                    sheetXml = sheetXml.replace('</worksheet>', '<drawing r:id="rId1"/></worksheet>');
                    zip.file('xl/worksheets/sheet1.xml', sheetXml);

                    let contentTypesXml = await zip.file('[Content_Types].xml').async('string');
                    if (!contentTypesXml.includes('/xl/drawings/drawing1.xml')) {
                        contentTypesXml = contentTypesXml.replace(
                            '</Types>',
                            '<Override PartName="/xl/drawings/drawing1.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/></Types>'
                        );
                    }
                    zip.file('[Content_Types].xml', contentTypesXml);

                    const finalBlob = await zip.generateAsync({ type: 'blob' });
                    const url = URL.createObjectURL(finalBlob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = fileName;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                    showMsg("Report with age distribution chart downloaded successfully.", "success");
                } catch (err) {
                    console.error('Chart embedding failed, falling back to data-only report', err);
                    XLSX.writeFile(workbook, fileName);
                    showMsg("Report downloaded (chart image couldn't be embedded).", "info");
                }
            };

            return (
                <div className="flex flex-col min-h-screen relative">
                    {message && <MessageBox message={message.text} type={message.type} onClose={() => setMessage(null)} />}
                    
                    {/* Database status banner info */}

                        'bg-blue-50 text-blue-800 dark:bg-blue-950/20 dark:text-blue-300 border-blue-100 dark:border-blue-900/50'
                    }`}>

                            }`}></span>
                        </span>
                        <span>{dbStatusText}</span>
                        {dbStatusType === 'success' && (
                            <span className="opacity-80 text-[10px] bg-emerald-100 dark:bg-emerald-900 px-2 py-0.5 rounded ml-2">
                                Bypass Active: Graceful Auth Mode Enabled
                            </span>

                    </div>

                    {}
                    <nav className="sticky top-0 z-50 glass border-b dark:border-slate-700 px-6 py-4 flex flex-wrap justify-between items-center shadow-sm">

                        <div className="flex items-center space-x-3 cursor-pointer animate-fade-in" onClick={() => handleNavigation('home')}>

                                {/* ---- TAB: CAMP SETTINGS ---- */}
                                {adminTab === 'settings' && (
                                    <div className="space-y-6 animate-fade-in">
                                        <div className="bg-white dark:bg-slate-800 p-6 md:p-8 rounded-2xl border dark:border-slate-700 shadow-sm max-w-2xl">
                                            <h3 className="font-bold text-lg mb-2 flex items-center"><i className="fa-solid fa-campground mr-2 text-emerald-500"></i> Edit Camp Date, Timings & Venue</h3>
                                            <p className="text-sm text-slate-500 mb-6">These details are shown to everyone in the "About This Medical Camp" section on the Home page. Updates here go live instantly for all visitors.</p>
                                            <form onSubmit={handleUpdateCampSettings} className="space-y-4">
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-400 uppercase mb-1.5">Camp Date</label>
                                                    <input required name="campDate" type="text" defaultValue={campSettings.date} placeholder="e.g. Every Saturday & Sunday" className="w-full px-4 py-3 border dark:border-slate-600 rounded-xl bg-slate-50 dark:bg-slate-900 text-sm outline-none focus:ring-2 focus:ring-emerald-500" />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-400 uppercase mb-1.5">Timings</label>
                                                    <input required name="campTiming" type="text" defaultValue={campSettings.timing} placeholder="e.g. 9:00 AM – 4:00 PM" className="w-full px-4 py-3 border dark:border-slate-600 rounded-xl bg-slate-50 dark:bg-slate-900 text-sm outline-none focus:ring-2 focus:ring-emerald-500" />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-400 uppercase mb-1.5">Venue</label>
                                                    <input required name="campVenue" type="text" defaultValue={campSettings.venue} placeholder="e.g. Community Hall, Camp Grounds" className="w-full px-4 py-3 border dark:border-slate-600 rounded-xl bg-slate-50 dark:bg-slate-900 text-sm outline-none focus:ring-2 focus:ring-emerald-500" />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-400 uppercase mb-1.5">Google Maps Link (optional)</label>
                                                    <input name="campMapUrl" type="url" defaultValue={campSettings.mapUrl} placeholder="https://maps.google.com/?q=..." className="w-full px-4 py-3 border dark:border-slate-600 rounded-xl bg-slate-50 dark:bg-slate-900 text-sm outline-none focus:ring-2 focus:ring-emerald-500" />
                                                    <p className="text-xs text-slate-400 mt-1.5">Paste a Google Maps share link. A clickable "View on Map" link will appear next to the Venue on the Home page.</p>
                                                </div>
                                                <button type="submit" className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg transition flex items-center justify-center">
                                                    <i className="fa-solid fa-floppy-disk mr-2"></i> Save & Publish to Home Page
                                                </button>
                                            </form>
                                        </div>
                                    </div>
                                )}

                                {/* ---- TAB: ANALYTICS ---- */}
                                {adminTab === 'analytics' && (
                                    <div className="space-y-6 animate-fade-in">
                                        <div className="grid md:grid-cols-2 gap-6">
                                            {/* Patient Status Breakdown */}
                                            <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl border dark:border-slate-700 shadow-sm">
                                                <h3 className="font-bold text-lg mb-5 flex items-center"><i className="fa-solid fa-chart-pie mr-2 text-emerald-500"></i> Patient Status Breakdown</h3>
                                                {totalPatients === 0 ? (
                                                    <p className="text-sm text-slate-400 italic text-center py-4">No patient data yet.</p>
                                                ) : (
                                                    <div className="flex flex-col sm:flex-row items-center gap-6">
                                                        <DonutChart segments={statusBreakdown} />
                                                        <div className="w-full flex-1 space-y-4">
                                                            {statusBreakdown.map(s => (
                                                                <div key={s.label}>
                                                                    <div className="flex justify-between text-xs font-bold mb-1">
                                                                        <span className="text-slate-600 dark:text-slate-300 flex items-center gap-1.5">
                                                                            <span className="w-2.5 h-2.5 rounded-full inline-block" style={{ backgroundColor: s.hex }}></span>
                                                                            {s.label}
                                                                        </span>
                                                                        <span className="text-slate-500">{s.count} <span className="text-slate-400 font-semibold">({Math.round((s.count / statusTotalBase) * 100)}%)</span></span>
                                                                    </div>
                                                                    <div className="w-full h-3 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden">
                                                                        <div className={`h-full ${s.color} rounded-full transition-all duration-500`} style={{ width: `${(s.count / statusTotalBase) * 100}%` }}></div>
                                                                    </div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                )}
                                            </div>

                                            {/* Gender Breakdown */}
                                            <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl border dark:border-slate-700 shadow-sm">
                                                <h3 className="font-bold text-lg mb-5 flex items-center"><i className="fa-solid fa-venus-mars mr-2 text-blue-500"></i> Gender Breakdown</h3>
                                                {totalPatients === 0 ? (
                                                    <p className="text-sm text-slate-400 italic text-center py-4">No patient data yet.</p>
                                                ) : (
                                                    <div className="flex flex-col sm:flex-row items-center gap-6">
                                                        <DonutChart segments={genderBreakdown} />
                                                        <div className="w-full flex-1 space-y-4">
                                                            {genderBreakdown.map(g => (
                                                                <div key={g.label}>
                                                                    <div className="flex justify-between text-xs font-bold mb-1">
                                                                        <span className="text-slate-600 dark:text-slate-300 flex items-center gap-1.5">
                                                                            <span className="w-2.5 h-2.5 rounded-full inline-block" style={{ backgroundColor: g.hex }}></span>
                                                                            {g.label}
                                                                        </span>
                                                                        <span className="text-slate-500">{g.count} <span className="text-slate-400 font-semibold">({Math.round((g.count / genderTotalBase) * 100)}%)</span></span>
                                                                    </div>
                                                                    <div className="w-full h-3 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden">
                                                                        <div className={`h-full ${g.color} rounded-full transition-all duration-500`} style={{ width: `${(g.count / genderTotalBase) * 100}%` }}></div>
                                                                    </div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        </div>

                                        {/* Doctor-wise Patients Handled */}
                                        <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl border dark:border-slate-700 shadow-sm">
                                            <h3 className="font-bold text-lg mb-5 flex items-center"><i className="fa-solid fa-user-doctor mr-2 text-rose-500"></i> Patients Handled Per Doctor</h3>
                                            <div className="space-y-4">
                                                {doctorBreakdown.map(d => (
                                                    <div key={d.label}>
                                                        <div className="flex justify-between text-xs font-bold mb-1">
                                                            <span className="text-slate-600 dark:text-slate-300">{d.label}</span>
                                                            <span className="text-slate-500">{d.count} <span className="text-slate-400 font-semibold">({Math.round((d.count / doctorTotalBase) * 100)}%)</span></span>
                                                        </div>
                                                        <div className="w-full h-3 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden">
                                                            <div className="h-full bg-rose-500 rounded-full transition-all duration-500" style={{ width: `${(d.count / doctorTotalBase) * 100}%` }}></div>
                                                        </div>
                                                    </div>
                                                ))}
                                                {doctorBreakdown.length === 0 && <p className="text-sm text-slate-400 italic text-center py-4">No doctors added yet.</p>}
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* ---- TAB: REPORTS ---- */}
                                {adminTab === 'reports' && (
                                    <div className="space-y-6 animate-fade-in">
                                        <div className="bg-white dark:bg-slate-800 p-8 rounded-2xl border dark:border-slate-700 shadow-sm">
                                            <div className="flex items-center mb-4">
                                                <div className="w-12 h-12 bg-emerald-100 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400 rounded-xl flex items-center justify-center text-xl mr-4"><i className="fa-solid fa-file-excel"></i></div>
                                                <div>
                                                    <h3 className="font-bold text-lg">Generate Full Camp Report</h3>
                                                    <p className="text-sm text-slate-500">Download a properly formatted Excel sheet of every registered patient, their status, assigned doctor and prescription — columns auto-sized and header row frozen.</p>
                                                </div>
                                            </div>
                                            <button onClick={generateCsvReport} className="w-full sm:w-auto px-8 py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                                                <i className="fa-solid fa-download"></i> Download Excel Report
                                            </button>
                                        </div>

                                        <div className="bg-white dark:bg-slate-800 p-8 rounded-2xl border dark:border-slate-700 shadow-sm">
                                            <h3 className="font-bold text-lg mb-4 flex items-center"><i className="fa-solid fa-list-check mr-2 text-blue-500"></i> Report Summary</h3>
                                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 text-center">
                                                <div className="p-4 bg-slate-50 dark:bg-slate-900 rounded-xl border dark:border-slate-700">
                                                    <span className="block text-xl font-black text-slate-800 dark:text-white">{totalPatients}</span>
                                                    <span className="text-[10px] uppercase font-bold text-slate-400">Total Registered</span>
                                                </div>
                                                <div className="p-4 bg-slate-50 dark:bg-slate-900 rounded-xl border dark:border-slate-700">
                                                    <span className="block text-xl font-black text-emerald-600">{attendedCount}</span>
                                                    <span className="text-[10px] uppercase font-bold text-slate-400">Fully Attended</span>
                                                </div>
                                                <div className="p-4 bg-slate-50 dark:bg-slate-900 rounded-xl border dark:border-slate-700">
                                                    <span className="block text-xl font-black text-indigo-500">{inQueueCount + awaitingCount}</span>
                                                    <span className="text-[10px] uppercase font-bold text-slate-400">Still Pending</span>
                                                </div>
                                                <div className="p-4 bg-slate-50 dark:bg-slate-900 rounded-xl border dark:border-slate-700">
                                                    <span className="block text-xl font-black text-blue-500">{doctorCount + volunteerCount + pharmacyCount}</span>
                                                    <span className="text-[10px] uppercase font-bold text-slate-400">Total Staff On Duty</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* VIEW: VOLUNTEER DASHBOARD */}
                        {view === 'volunteer-dashboard' && currentUser?.role === 'Volunteer' && (
                            <div className="w-full max-w-4xl animate-fade-in space-y-6">
                                <div className="text-center mb-8">
                                    <h2 className="text-3xl font-black text-amber-600 dark:text-amber-500">Volunteer Station</h2>
                                    <p className="text-slate-500">Scan patient QRs and assign triage queues in real-time.</p>
                                </div>

                                {scanningFor === 'volunteer' ? (
                                    <QRScanner title="Scan Patient Identity QR" onScan={handleVolunteerScan} onCancel={() => setScanningFor(null)} />
                                ) : (
                                    <div className="flex justify-center mb-6">
                                        <button onClick={() => setScanningFor('volunteer')} className="bg-amber-500 hover:bg-amber-600 text-white font-bold px-8 py-4 rounded-full shadow-lg transition transform hover:-translate-y-1 flex items-center text-lg w-full md:w-auto justify-center">
                                            <i className="fa-solid fa-qrcode mr-3 text-2xl"></i> Scan Patient Card QR
                                        </button>
                                    </div>
                                )}

                                {scannedPatient && (
                                    <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl border-2 border-amber-400 shadow-xl max-w-lg mx-auto transform transition animate-fade-in-down">
                                        <div className="flex justify-between items-start mb-4 border-b border-slate-100 dark:border-slate-700 pb-4">
                                            <div>
                                                <h3 className="text-xl font-bold dark:text-white">{scannedPatient.name}</h3>
                                                <p className="text-sm text-slate-500">{scannedPatient.age} yrs • {scannedPatient.gender}</p>
                                            </div>
                                            <span className="bg-amber-100 text-amber-800 text-xs font-bold px-2 py-1 rounded uppercase">Processing</span>
                                        </div>
                                        <div className="mb-6">
                                            <p className="text-xs font-bold text-slate-400 uppercase mb-1">Reported Symptoms</p>
                                            <p className="text-sm bg-slate-50 dark:bg-slate-900 p-3 rounded-lg border dark:border-slate-700">{scannedPatient.symptoms}</p>
                                        </div>
                                        
                                        <div>
                                            <p className="text-xs font-bold text-slate-400 uppercase mb-2">Assign to Consultant Doctor</p>
                                            <div className="space-y-2">
                                                {users.filter(u => u.role === 'Doctor').map(doc => {
                                                    const qCount = getDoctorQueueCount(doc.id);
                                                    const isFree = qCount === 0;
                                                    return (
                                                        <button key={doc.id} onClick={() => assignDoctor(doc.id)} 
                                                            className={`w-full flex justify-between items-center p-3 rounded-xl border transition ${isFree ? 'bg-emerald-50 border-emerald-200 hover:bg-emerald-100 dark:bg-emerald-950/20 dark:border-emerald-900/50' : 'bg-slate-50 border-slate-200 hover:bg-slate-100 dark:bg-slate-800 dark:border-slate-700'}`}>
                                                            <span className="font-bold text-slate-800 dark:text-slate-200">{doc.name}</span>
                                                            {isFree 
                                                                ? <span className="text-xs font-bold text-emerald-600 bg-emerald-100 px-2 py-1 rounded-full"><i className="fa-solid fa-check mr-1"></i> FREE</span>
                                                                : <span className="text-xs font-bold text-amber-600 bg-amber-100 px-2 py-1 rounded-full"><i className="fa-solid fa-users mr-1"></i> Queue: {qCount}</span>
                                                            }
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* VIEW: DOCTOR DASHBOARD */}
                        {view === 'doctor-dashboard' && currentUser?.role === 'Doctor' && (
                            <div className="w-full max-w-4xl animate-fade-in space-y-6">
                                <div className="flex flex-col md:flex-row justify-between items-center mb-6 pb-4 border-b border-slate-200 dark:border-slate-700">
                                    <div className="text-center md:text-left">
                                        <h2 className="text-3xl font-black text-blue-600 dark:text-blue-400">Doctor's Desk</h2>
                                        <p className="text-slate-500 font-medium">Welcome, {currentUser.name}</p>
                                    </div>
                                    <div className="mt-4 md:mt-0 bg-white dark:bg-slate-800 px-4 py-2 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 flex items-center space-x-3">
                                        <span className="text-sm font-bold text-slate-500 uppercase">CURRENT QUEUE:</span>
                                        <span className="text-2xl font-black text-blue-600">{getDoctorQueueCount(currentUser.id)}</span>
                                    </div>
                                </div>

                                {(() => {
                                    // Live reactive queue matching doctor ID and state in real-time
                                    const myQueue = patients.filter(p => p.assignedDoctor === currentUser.id && p.status === 'In Queue');
                                    
                                    if (myQueue.length === 0) {
                                        return (
                                            <div className="bg-slate-50 dark:bg-slate-800/50 border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-3xl p-12 text-center">
                                                <div className="w-24 h-24 bg-white dark:bg-slate-700 rounded-full flex items-center justify-center text-5xl mx-auto mb-6 text-slate-300 shadow-sm">
                                                    <i className="fa-solid fa-mug-hot"></i>
                                                </div>
                                                <h3 className="text-2xl font-bold text-slate-700 dark:text-slate-300 mb-2">You are currently Free</h3>
                                                <p className="text-slate-500">Volunteers see your status as "FREE" and can assign patients to you.</p>
                                            </div>
                                        );
                                    }

                                    const activePatient = myQueue[0];

                                    return (
                                        <div className="grid md:grid-cols-5 gap-6">
                                            <div className="md:col-span-3 bg-white dark:bg-slate-800 rounded-3xl shadow-xl border-2 border-blue-400 overflow-hidden relative">
                                                <div className="bg-blue-600 text-white text-xs font-bold uppercase tracking-widest py-1.5 text-center">Active Session</div>
                                                <div className="p-6 md:p-8 space-y-6">
                                                    <div className="flex justify-between items-start border-b dark:border-slate-700 pb-4">
                                                        <div>
                                                            <h3 className="text-2xl font-black text-slate-800 dark:text-white mb-1">{activePatient.name}</h3>
                                                            <p className="text-sm font-medium text-slate-500">ID: {activePatient.id} • {activePatient.age} yrs • {activePatient.gender}</p>
                                                        </div>
                                                    </div>
                                                    <div>
                                                        <h4 className="text-xs font-bold text-slate-400 uppercase mb-2"><i className="fa-solid fa-notes-medical mr-1"></i> Patient Symptoms</h4>
                                                        <div className="bg-rose-50 text-rose-900 dark:bg-rose-900/20 dark:text-rose-200 p-4 rounded-xl text-sm font-medium border border-rose-100 dark:border-rose-800">
                                                            {activePatient.symptoms}
                                                        </div>
                                                    </div>
                                                    <form onSubmit={(e) => {
                                                        e.preventDefault();
                                                        handleEndSession(activePatient.id, e.target.rx.value);
                                                    }}>
                                                        <h4 className="text-xs font-bold text-slate-400 uppercase mb-2"><i className="fa-solid fa-prescription-bottle mr-1"></i> Add Prescription</h4>
                                                        <textarea required name="rx" rows="4" placeholder="Type medicines, dosage, and instructions here..." className="w-full px-4 py-3 border border-slate-200 dark:border-slate-600 rounded-xl bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-blue-500 outline-none mb-4 resize-none"></textarea>
                                                        
                                                        <button type="submit" className="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition flex items-center justify-center text-lg">
                                                            End Session & Dispatch Rx <i className="fa-solid fa-arrow-right ml-3"></i>
                                                        </button>
                                                    </form>
                                                </div>
                                            </div>

                                            <div className="md:col-span-2 space-y-4 animate-fade-in">
                                                <h3 className="font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wide text-sm flex items-center">
                                                    <i className="fa-solid fa-list-ul mr-2"></i> Next in line ({myQueue.length - 1})
                                                </h3>
                                                {myQueue.slice(1).map((p, index) => (
                                                    <div key={p.id} className="bg-white/60 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 p-4 rounded-2xl flex items-center space-x-4 opacity-75">
                                                        <div className="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-700 flex items-center justify-center font-bold text-slate-500 text-xs">
                                                            {index + 1}
                                                        </div>
                                                        <div>
                                                            <div className="font-bold text-slate-700 dark:text-slate-300 text-sm">{p.name}</div>
                                                            <div className="text-xs text-slate-500">{p.age}y • {p.gender}</div>
                                                        </div>
                                                    </div>
                                                ))}
                                                {myQueue.length === 1 && (
                                                    <p className="text-sm text-slate-400 italic bg-white dark:bg-slate-800 p-4 rounded-xl border border-dashed dark:border-slate-700 text-center">No other patients waiting.</p>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })()}
                            </div>
                        )}

                        {/* VIEW: PHARMACY COUNTER DASHBOARD */}
                        {view === 'pharmacy-dashboard' && currentUser?.role === 'Pharmacy' && (
                            <div className="w-full max-w-4xl animate-fade-in space-y-6">
                                <div className="text-center mb-8">
                                    <h2 className="text-3xl font-bold text-rose-600 dark:text-rose-500">Pharmacy Counter</h2>
                                    <p className="text-slate-500">Scan Rx QR codes to dispense medication and collect bills.</p>
                                </div>

                                {scanningFor === 'pharmacy' ? (
                                    <QRScanner title="Scan Patient Rx QR Code" onScan={handlePharmacyScan} onCancel={() => setScanningFor(null)} />
                                ) : (
                                    <div className="flex justify-center mb-6">
                                        <button onClick={() => setScanningFor('pharmacy')} className="bg-rose-500 hover:bg-rose-600 text-white font-bold px-8 py-4 rounded-full shadow-lg transition transform hover:-translate-y-1 flex items-center text-lg w-full md:w-auto justify-center">
                                            <i className="fa-solid fa-qrcode mr-3 text-2xl"></i> Scan Patient Rx QR
                                        </button>
                                    </div>
                                )}

                                {billingPatient && (
                                    <div className="bg-white dark:bg-slate-800 p-8 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-xl max-w-xl mx-auto transform transition animate-fade-in-down">
                                        <div className="flex items-center space-x-3 mb-6 pb-6 border-b dark:border-slate-700">
                                            <div className="w-12 h-12 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center text-2xl"><i className="fa-solid fa-prescription"></i></div>
                                            <div>
                                                <h3 className="text-xl font-bold dark:text-white">Rx for {billingPatient.name}</h3>
                                                <p className="text-sm text-slate-500">Patient ID: {billingPatient.id}</p>
                                            </div>
                                        </div>
                                        
                                        <div className="mb-6">
                                            <p className="text-xs font-bold text-slate-400 uppercase mb-2">Doctor's Prescription Details</p>
                                            <div className="bg-slate-50 dark:bg-slate-900 p-4 rounded-xl border border-dashed dark:border-slate-700 font-mono text-sm dark:text-slate-300 whitespace-pre-line">
                                                {billingPatient.prescription}
                                            </div>
                                        </div>

                                        <div className="bg-emerald-50 dark:bg-emerald-950/10 p-5 rounded-2xl border border-emerald-100 dark:border-emerald-900/50 space-y-4">
                                            <div className="flex items-center text-emerald-800 dark:text-emerald-300 text-sm font-semibold">
                                                <i className="fa-solid fa-hand-holding-heart mr-2 text-lg"></i>
                                                Medicines are provided free of cost at this camp. No payment needs to be collected.
                                            </div>
                                            <button onClick={completeDispense} className="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg transition flex items-center justify-center text-lg">
                                                <i className="fa-solid fa-box-open mr-2"></i> Confirm Medication Given & Complete Visit
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                    </main>
                    
                    <footer className="text-center py-6 text-sm font-medium text-slate-400 border-t dark:border-slate-800">
                        &copy; 2026 CareNet NGO Medical Camp Management System. Realtime cloud-synchronized active network.
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
